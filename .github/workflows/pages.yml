name: pages

# Publishes the WebGPU demo to https://<user>.github.io/<repo>/
# (Settings -> Pages -> Source: "GitHub Actions")
on:
  push:
    branches: [main]
    paths: ["web/**", "index.html", ".github/workflows/pages.yml"]  # only when the site itself changes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits instead of cancelling a deployment halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deploy are separate jobs, like GitHub's own Pages templates: the list of a run's artifacts
  # can lag behind an upload, so deploy-pages in the same job sometimes doesn't see the artifact yet.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - run: mkdir -p _site && cp -r web index.html _site/ && rm -f _site/web/test.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
